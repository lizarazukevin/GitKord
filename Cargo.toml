[package]
name = "git_kord"
version = "0.1.0"
edition = "2021"
description = "A live pull request companion for Discord, powered by Rust"
license = "MIT"
repository = "https://github.com/lizarazukevin/GitKord"
keywords = ["discord", "github", "bot", "webhook"]
categories = ["web-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full"] }

# HTTP server — receives GitHub webhooks
axum = { version = "0.8", features = ["macros"] }

# Discord gateway + slash registry
serenity = { version = "0.12", features = ["client", "gateway", "model", "cache", "http"] }

# GitHub REST API client
octocrab = "0.54"

# Postgres persistence (compile-time checked queries)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP types shared between axum and reqwest
http = "1.4"

# HMAC-SHA256 signature verification for GitHub webhooks
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Serialization / deserialization (JSON payloads, config)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async trait support (needed for trait objects with async methods)
async-trait = "0.1"

# Ergonomic error handling
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"

indexmap = "2.14"
jsonwebtoken = "10.4"
prometheus = "0.14"
metrics-exporter-prometheus = "0.18"
metrics = "0.24.6"
histogram = "1.5.0"

# Inspired by: https://www.namtao.com/rust/
[lints.clippy]
# Opinionated and developing lints
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Deny Panics
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
