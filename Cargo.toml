[package]
name = "GitKord"
version = "0.1.0"
edition = "2021"
description = "A live pull request companion for Discord, powered by Rust"
license = "MIT"
repository = "https://github.com/lizarazukevin/GitKord"
keywords = ["discord", "github", "bot", "webhook"]
categories = ["web-programming"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server — receives GitHub webhooks
axum = { version = "0.8", features = ["macros"] }

# Discord gateway + slash commands
serenity = { version = "0.12", features = ["client", "gateway", "model", "cache", "http"] }

# GitHub REST API client
octocrab = "0.50"

# SQLite persistence (compile-time checked queries)
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP types shared between axum and reqwest
http = "1"

# HMAC-SHA256 signature verification for GitHub webhooks
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Serialization / deserialization (JSON payloads, config)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async trait support (needed for trait objects with async methods)
async-trait = "0.1"

# Ergonomic error handling
anyhow = "1"
thiserror = "2.0.18"
chrono = "0.4.44"

indexmap = "2"
