---
# Keeps GitHub Actions versions and Rust crate dependencies current.
#
# github-actions: monthly checks, all updates bundled into one grouped PR.
#
# cargo: weekly checks for faster visibility into security patches and
#        performance improvements, but with risk‑tiered grouping:
#   - patch/minor bumps are bundled into a single low‑risk PR per cycle.
#   - major version bumps are deliberately excluded from grouping so each
#     lands as its own clearly‑labeled PR. Major bumps are the ones most
#     likely to need an actual look at changelogs / breaking changes
#     before merging.
#
# Neither ecosystem auto‑merges anything — PRs only propose updates;
# merging is still a manual decision.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/infra/loki"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/infra/prometheus"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/infra/grafana"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"