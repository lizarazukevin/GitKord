---
# Builds and lints GitKord (Rust, single crate).
#
# The workflow checks formatting (rustfmt) and runs Clippy with warnings
# promoted to hard errors. Then it compiles all targets and runs the
# test suite. Cargo's dependency and build artifacts are cached so that
# follow‑up runs complete quickly.
#
# Steps run in order: format check → clippy lint → build → test.

name: Rust Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings/*.html
          retention-days: 7

      - name: Summarize cache status
        if: always()
        run: |
          {
            echo "## Rust cache status (build-and-lint)"
            echo "- cache-hit: ${{ steps.cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Summarize cache status
        if: always()
        run: |
          {
            echo "## Rust cache status (test)"
            echo "- cache-hit: ${{ steps.cache.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
