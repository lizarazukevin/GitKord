
name: Redeliver failed webhook deliveries

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redeliver-failed-webhook-deliveries
  cancel-in-progress: false

jobs:
  redeliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Octokit
        run: npm install octokit

      - name: Recover failed deliveries
        env:
          APP_ID: ${{ secrets.GITKORD_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GITKORD_APP_PRIVATE_KEY }}
        run: node .github/workflows/scripts/redeliver-failed-deliveries.mjs
