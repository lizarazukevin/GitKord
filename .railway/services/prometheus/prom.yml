global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "GitKord"
    static_configs:
      - targets: ["gitkord.railway.internal:9090"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq.railway.internal:15692"]

  - job_name: "rabbitmq-detailed"
    metrics_path: "/metrics/detailed"
    params:
      family: ["queue_coarse_metrics", "queue_metrics"]
    static_configs:
      - targets: ["rabbitmq.railway.internal:15692"]
